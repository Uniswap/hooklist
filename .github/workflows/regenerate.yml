name: Regenerate Registry

on:
  push:
    branches: [main]
    paths: ['hooks/**', 'families/**', 'index/**']

concurrency:
  group: regenerate-registry
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate hooklist.json
        run: python scripts/aggregate.py

      - name: Build published artifacts (dist/)
        run: python scripts/build_artifacts.py

      - name: Commit and push
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "hook-registry-bot[bot]"
          git config user.email "hook-registry-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git add hooklist.json hooklist-vanilla-swap.json
          git diff --staged --quiet || git commit -m "chore: regenerate hooklist.json"
          git push

      # dist/ is gitignored (uncommitted, ephemeral build output); the
      # committed hooklist.json / hooklist-vanilla-swap.json above remain the
      # raw-URL fallback for consumers who don't use Pages.
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp hooklist.json hooklist-vanilla-swap.json _site/
          cp -r dist/. _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy-pages:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the uploaded artifact to GitHub Pages
      id-token: write  # required by actions/deploy-pages for OIDC verification
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
