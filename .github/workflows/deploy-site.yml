name: Deploy Site

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
