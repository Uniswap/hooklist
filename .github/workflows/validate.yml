name: Validate Hook Files

on:
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Two checkouts: base branch (trusted scripts) and PR head (hook files to validate)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.base_ref }}
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: pr
          fetch-depth: 0

      - name: Check for registry changes and enforce diff policy
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # --paginate: the files endpoint returns 30 entries per page; without
          # it, files 31+ (including .github/**) would escape the policy gates
          # below. Pages arrive as concatenated JSON arrays; each jq filter here
          # uses .[] applied per input document, which is pagination-safe.
          FILES_JSON=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files")
          CHANGED=$(echo "$FILES_JSON" | jq -r '.[].filename')

          HOOKS=$(echo "$CHANGED" | grep '^hooks/' || true)
          FAMILIES=$(echo "$CHANGED" | grep '^families/' || true)
          INDEX=$(echo "$CHANGED" | grep '^index/' || true)
          OTHER=$(echo "$CHANGED" | grep -v -e '^hooks/' -e '^families/' -e '^index/' || true)

          if [ -z "$HOOKS$FAMILIES$INDEX" ]; then
            echo "data=false" >> "$GITHUB_OUTPUT"
            echo "No registry data files changed, skipping validation."
            exit 0
          fi
          if [ -n "$OTHER" ]; then
            echo "::error::Registry-data PR also modifies other files: $OTHER"
            exit 1
          fi
          # Allowed combinations (spec CI policy matrix):
          #  - index/** only (mechanical)
          #  - families/<id>.json alone, or with hooks/** files (delegating case)
          #  - hooks/** file(s) alone (enrichment / delegating instances)
          if [ -n "$INDEX" ] && [ -n "$HOOKS$FAMILIES" ]; then
            echo "::error::index/ changes must not mix with hooks/ or families/ changes"
            exit 1
          fi
          FAM_COUNT=$(echo "$FAMILIES" | grep -c . || true)
          if [ "$FAM_COUNT" -gt 1 ]; then
            echo "::error::PR must change at most one family file, found $FAM_COUNT"
            exit 1
          fi
          echo "data=true" >> "$GITHUB_OUTPUT"

          # Schema/flag validation only applies to files still present on the
          # PR head (added/modified). Removed files have no content to check.
          echo "$FILES_JSON" | jq -r '.[] | select(.status != "removed") | .filename' \
            | grep -e '^hooks/' -e '^families/' | sed 's|^|pr/|' > changed_data.txt || true
          echo "$FILES_JSON" | jq -r '.[] | select(.status != "removed") | .filename' \
            | grep '^index/.*\.jsonl$' > changed_index.txt || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.changed.outputs.data == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.changed.outputs.data == 'true'
        run: pip install -r trusted/requirements.txt

      - name: Validate hook/family files against schema
        if: steps.changed.outputs.data == 'true'
        run: |
          if [ -s changed_data.txt ]; then
            python trusted/scripts/validate.py $(cat changed_data.txt)
          else
            echo "No hooks/ or families/ files to schema-validate."
          fi

      - name: Verify flags match address bitmask
        if: steps.changed.outputs.data == 'true'
        run: |
          HOOK_FILES=$(grep '^pr/hooks/' changed_data.txt || true)
          if [ -n "$HOOK_FILES" ]; then
            python trusted/scripts/verify_flags.py $HOOK_FILES
          else
            echo "No hooks/ files to flag-verify."
          fi

      - name: Re-derive index lines
        if: steps.changed.outputs.data == 'true'
        run: |
          if [ ! -s changed_index.txt ]; then
            echo "No index/ files changed."
            exit 0
          fi
          # This step is a security backstop, so it must fail closed: if the
          # base ref cannot be resolved, diffing against it would silently
          # produce zero lines and "validate" nothing. Verify it up front.
          BASE_REF="origin/${{ github.base_ref }}"
          if ! git -C pr rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::Cannot resolve ${BASE_REF} in the PR checkout; refusing to skip index re-derivation"
            exit 1
          fi
          while read -r f; do
            CHAIN=$(basename "$f" .jsonl)
            git -C pr diff "$BASE_REF" -- "$f" > diff_out.txt
            sed -n '/^+{/s/^+//p' diff_out.txt > added_lines.txt
            if [ -s added_lines.txt ]; then
              python trusted/scripts/validate_index.py "$CHAIN" --file added_lines.txt
            fi
          done < changed_index.txt
